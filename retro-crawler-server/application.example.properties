# Standard Spring Boot server configuration
server.port=8080

# Writable, rebuildable clue repository shared by the configured archives
retro-crawler.repository.root=/repository

# Source archives interpreted by the collection extension JAR
retro-crawler.archives[0].id=hardware
retro-crawler.archives[0].name=Hardware
retro-crawler.archives[0].root=/archives/hardware

retro-crawler.archives[1].id=software
retro-crawler.archives[1].name=Software
retro-crawler.archives[1].root=/archives/software

# Scheduling is configuration-only until the shared crawl coordinator exists
retro-crawler.server.crawl.enabled=false
retro-crawler.server.crawl.cron=0 0 3 * * *
retro-crawler.server.crawl.zone=Europe/Berlin
